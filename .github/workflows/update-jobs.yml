name: Update Job Bench listings

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily = 07:00 Lagos time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and score jobs
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: node update-jobs.mjs

      - name: Show result summary
        run: |
          echo "----- jobs.json summary -----"
          node -e "const d=require('./jobs.json'); console.log('count:', d.count, 'generatedAt:', d.generatedAt);"

      - name: Commit updated jobs.json
        run: |
          git config user.name "job-bench-bot"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update jobs.json"
            git push origin HEAD:${{ github.ref_name }}
          fi
